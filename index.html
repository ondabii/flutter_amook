<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="amook_contest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <title>amook_contest</title>
  <link rel="manifest" href="manifest.json">

  <!-- 팝업 창 크기 자동 조절 스크립트 -->
  <script>
    window.addEventListener('load', function() {
      // 데스크탑 환경(화면 가로가 768px 이상)에서 팝업(opener 존재)으로 열렸을 때
      if (window.opener && window.screen.width > 768) {
        // 모바일 비율의 적절한 창 크기 (세로가 긴 형태)
        var targetWidth = 480;
        var targetHeight = 850;
        
        // 브라우저 윈도우 크기 강제 조절
        window.resizeTo(targetWidth, targetHeight);
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
